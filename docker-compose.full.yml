# The whole Pactora backend from its production images — the same recipe a
# deployment builds — on a Postgres of its own:
#
#   SIGNER_TOKEN=$(openssl rand -hex 24) SIGNER_KEY_PASSPHRASE=$(openssl rand -hex 24) \
#   OBJECT_STORE_SECRET_ACCESS_KEY=$(openssl rand -hex 24) \
#   MINIO_KMS_SECRET_KEY="pactora:$(head -c 32 /dev/urandom | base64)" \
#     docker compose -f docker-compose.full.yml up --build
#
# NEAR testnet by default (ENABLED_CHAINS / DEFAULT_CHAIN, CAIP-2 ids). Against
# a local sandbox node on this machine:
#   ENABLED_CHAINS=near:sandbox RPC_URL_SANDBOX=http://host.docker.internal:3030 …
#
# Separate from docker-compose.yml (the dev database the tests use), on its own
# project, volume and host port (127.0.0.1:5444; the dev database is 5443),
# so bringing this up never touches dev data.
# Services start in dependency order and only once what they need is READY:
# postgres → migrate (runs once, must succeed) → signer → api, and the indexer.
name: pactora-full

x-build: &build
  context: .
  dockerfile: Dockerfile
  # The chain facts every image carries come from chain/ (see the
  # Dockerfile): the same single-repo build a hosted deployment runs.

# Docker keeps container logs forever by default, and the API's request log
# holds callers' IP addresses. Each service keeps at most 5 × 10 MB, oldest
# dropped first.
x-logging: &logging
  driver: json-file
  options: {max-size: '10m', max-file: '5'}

x-chain: &chain
  ENABLED_CHAINS: ${ENABLED_CHAINS:-near:testnet}
  DEFAULT_CHAIN: ${DEFAULT_CHAIN:-near:testnet}
  # RPC per network slug. The config reads these with `??`, so an empty value
  # would be used as the URL: each has a real default. A sandbox node runs on
  # the host, which a container reaches as host.docker.internal.
  RPC_URL_TESTNET: ${RPC_URL_TESTNET:-https://rpc.testnet.near.org}
  RPC_URL_SANDBOX: ${RPC_URL_SANDBOX:-http://host.docker.internal:3030}
  DATABASE_URL: postgres://pactora:pactora@postgres:5432/pactora
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pactora
      POSTGRES_PASSWORD: pactora
      POSTGRES_DB: pactora
    ports: ['127.0.0.1:5444:5432']
    volumes: ['pactora-full-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pactora']
      interval: 3s
      retries: 20

  # Evidence storage (docs/26 F6): S3-compatible, private, server-side
  # encrypted. Publishes no port: only the api reaches it, on the compose
  # network. The SSE key is a secret the operator holds (MINIO_KMS_SECRET_KEY,
  # `pactora:<32 random bytes, base64>`), required at start. It used to be
  # generated into the data volume, beside the objects it encrypts, so a copy
  # of the volume carried both (audit L4). Keep it with the other secrets:
  # without it no stored evidence can be read.
  minio:
    logging: *logging
    image: cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:-pactora}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY (8+ characters), the evidence store's password}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY (pactora:<32 random bytes, base64>, see deploy/vps/README.md), the evidence store's encryption key}
    volumes: ['pactora-full-minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 12
    restart: unless-stopped

  # The bucket, made once (the api never creates one in production).
  minio-setup:
    logging: *logging
    image: cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    entrypoint: ['/bin/sh', '-c']
    command:
      - mc alias set store http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "store/$$BUCKET"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:-pactora}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY}
      BUCKET: ${OBJECT_STORE_BUCKET:-pactora-evidence}
    depends_on:
      minio: {condition: service_healthy}
    restart: 'no'

  migrate:
    logging: *logging
    build: {<<: *build, args: {SERVICE: '@pactora/db'}}
    command: ['node', 'bin/migrate.mjs']
    environment:
      DATABASE_URL: postgres://pactora:pactora@postgres:5432/pactora
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'

  signer:
    logging: *logging
    build: {<<: *build, args: {SERVICE: '@pactora/signer'}}
    environment:
      <<: *chain
      # With a token the signer listens on every interface — here, only the
      # compose network; it publishes no port.
      SIGNER_TOKEN: ${SIGNER_TOKEN:?set SIGNER_TOKEN (32+ characters), shared with the api}
      # The agents' wallet keys (POST /keys) are kept encrypted in Postgres
      # under this; without it the signer cannot create a wallet key.
      SIGNER_KEY_PASSPHRASE: ${SIGNER_KEY_PASSPHRASE:?set SIGNER_KEY_PASSPHRASE (32+ characters)}
      # Testnet only (near-cli credential JSON); the signer refuses it elsewhere.
      SIGNER_DEV_CREDENTIALS: ${SIGNER_DEV_CREDENTIALS:-}
      WALLET_LOW_BALANCE_YOCTO: ${WALLET_LOW_BALANCE_YOCTO:-} # the gas floor /v1/status and alerts.sh report against
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # The keeper: its own gas-only account, never a wallet the signer signs
      # for. No KEEPER_ACCOUNT_ID → no keeper runs.
      KEEPER_ACCOUNT_ID: ${KEEPER_ACCOUNT_ID:-}
      KEEPER_SECRET_KEY: ${KEEPER_SECRET_KEY:-}
      KEEPER_INTERVAL_MS: ${KEEPER_INTERVAL_MS:-15000}
      # The test-token faucet (testnet only; docs/26 F23): a separate account
      # holding a limited float, never the token's owner. None → no faucet.
      FAUCET_ACCOUNT_ID: ${FAUCET_ACCOUNT_ID:-}
      FAUCET_SECRET_KEY: ${FAUCET_SECRET_KEY:-}
      FAUCET_MAX_PER_SEND: ${FAUCET_MAX_PER_SEND:-10000000}
      # Off testnet: AWS KMS instead of the raw keys above — docs/21.
      SIGNER_KMS_KEYS: ${SIGNER_KMS_KEYS:-}
      KEEPER_KMS_KEY_ID: ${KEEPER_KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7070/ready']
      interval: 5s
      retries: 12
    restart: unless-stopped

  indexer:
    logging: *logging
    build: {<<: *build, args: {SERVICE: '@pactora/indexer'}}
    environment:
      <<: *chain
      INDEXER_HEALTH_PORT: 9090
      INDEXER_START_AT_HEAD: ${INDEXER_START_AT_HEAD:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Optional: a neardata.xyz key, for its higher rate limit on testnet.
      NEARDATA_API_KEY: ${NEARDATA_API_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/health']
      interval: 5s
      retries: 12
    restart: unless-stopped

  # Webhook delivery (docs/26 F9). Talks to the database and to the
  # internet only; it has no port of its own beyond its health check.
  notifier:
    logging: *logging
    build: {<<: *build, args: {SERVICE: '@pactora/notifier'}}
    environment:
      DATABASE_URL: postgres://pactora:pactora@postgres:5432/pactora
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?set WEBHOOK_SECRET_KEY (openssl rand -hex 32), shared with the api}
      NOTIFIER_HEALTH_PORT: 9091
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9091/health']
      interval: 5s
      retries: 12
    restart: unless-stopped

  # Telegram and email (docs/26 F11, F12). Off unless TELEGRAM_BOT_TOKEN is set.
  channels:
    logging: *logging
    build: {<<: *build, args: {SERVICE: '@pactora/channels'}}
    environment:
      DATABASE_URL: postgres://pactora:pactora@postgres:5432/pactora
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CHANNELS_SITE_URL: ${CHANNELS_SITE_URL:-https://pactoragents.com}
      CHANNELS_HEALTH_PORT: 9092
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9092/health']
      interval: 5s
      retries: 12
    restart: unless-stopped

  api:
    logging: *logging
    build: {<<: *build, args: {SERVICE: '@pactora/api'}}
    environment:
      <<: *chain
      SIGNER_URL: http://signer:7070
      SIGNER_TOKEN: ${SIGNER_TOKEN:?set SIGNER_TOKEN (32+ characters), shared with the signer}
      # Seals webhook secrets; the notifier needs the same value (docs/26 F9).
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?set WEBHOOK_SECRET_KEY (openssl rand -hex 32), shared with the notifier}
      FAUCET_AMOUNT: ${FAUCET_AMOUNT:-5000000}
      FAUCET_PER_IP_PER_DAY: ${FAUCET_PER_IP_PER_DAY:-5}
      FAUCET_DAILY_CAP: ${FAUCET_DAILY_CAP:-500000000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Production screening refuses to start without two reviewers (NEAR
      # accounts, comma-separated) who clear a strong sanctions match.
      COMPLIANCE_REVIEWERS: ${COMPLIANCE_REVIEWERS:-}
      MAX_AGENTS_PER_OWNER: ${MAX_AGENTS_PER_OWNER:-100}
      JUDGE_REQUIRE_ATTESTATION: ${JUDGE_REQUIRE_ATTESTATION:-}
      # Retention (README "Data retention"): days after settlement; 1 = count only.
      RETENTION_EVIDENCE_DAYS: ${RETENTION_EVIDENCE_DAYS:-180}
      RETENTION_CHAT_DAYS: ${RETENTION_CHAT_DAYS:-180}
      RETENTION_DRAFTS_DAYS: ${RETENTION_DRAFTS_DAYS:-90}
      RETENTION_JOB_EVENTS_DAYS: ${RETENTION_JOB_EVENTS_DAYS:-365}
      RETENTION_AGENT_EVENTS_READ_DAYS: ${RETENTION_AGENT_EVENTS_READ_DAYS:-90}
      RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-0}
      # Settings below are passed so the server's .env can set them; an empty
      # value is unset, so each service's own default applies (docs/08).
      SANCTIONS_SCREENING: ${SANCTIONS_SCREENING:-}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-}
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET:-}
      KYC_PAGE_BASE: ${KYC_PAGE_BASE:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      EMAIL_CHANNEL: ${EMAIL_CHANNEL:-}
      OBJECT_STORE_SSE: ${OBJECT_STORE_SSE:-}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Live runs: a model key (your quota) and a per-orchestrator daily cap.
      AGENT_MODE: ${AGENT_MODE:-cached}
      BRAIN_CHAIN_ORCHESTRATOR: ${BRAIN_CHAIN_ORCHESTRATOR:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # The judge on NEAR AI Cloud (off unless JUDGE_PROVIDER=near-ai; then the key is required).
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-}
      NEAR_AI_API_KEY: ${NEAR_AI_API_KEY:-}
      NEAR_AI_MODEL: ${NEAR_AI_MODEL:-}
      NEAR_AI_BASE_URL: ${NEAR_AI_BASE_URL:-}
      # A local model (no quota): BRAIN_CHAIN_ORCHESTRATOR=ollama, Ollama on the host.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      RUNS_PER_DAY: ${RUNS_PER_DAY:-0}
      # Evidence photos, in the minio service above.
      EVIDENCE_UPLOADS: ${EVIDENCE_UPLOADS:-on}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-pactora-evidence}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_FORCE_PATH_STYLE: '1'
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-pactora}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY}
    ports: ['${API_PORT:-8080}:8080']
    depends_on:
      signer: {condition: service_healthy}
      minio-setup: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/ready']
      interval: 5s
      retries: 12
    restart: unless-stopped

  # ── hosted live runs: the three worker bots (docker compose --profile hosted) ──
  research-bot: &worker
    logging: *logging
    profiles: [hosted]
    build: {<<: *build, args: {SERVICE: '@pactora/research-bot'}}
    environment: &worker-env
      PACTORA_API_URL: http://api:8080
      PACTORA_CHAIN_ID: ${DEFAULT_CHAIN:-near:testnet}
      PACTORA_API_KEY: ${RESEARCH_BOT_API_KEY:-}
      # The bots' own mode and chain (2026-11-12), so going live for them does
      # not make the API's hosted runs spend too. NEAR AI: BOT_BRAIN_CHAIN=near-ai.
      AGENT_MODE: ${BOT_AGENT_MODE:-${AGENT_MODE:-cached}}
      BRAIN_CHAIN: ${BOT_BRAIN_CHAIN:-${BRAIN_CHAIN:-}}
      NEAR_AI_API_KEY: ${NEAR_AI_API_KEY:-}
      NEAR_AI_MODEL: ${NEAR_AI_MODEL:-}
      # At most this many jobs a day per bot; the rest are declined and refunded.
      WORKER_MAX_JOBS_PER_DAY: ${WORKER_MAX_JOBS_PER_DAY:-50}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  trading-bot:
    logging: *logging
    <<: *worker
    build: {<<: *build, args: {SERVICE: '@pactora/trading-bot'}}
    environment:
      <<: *worker-env
      PACTORA_API_KEY: ${TRADING_BOT_API_KEY:-}

  execution-bot:
    logging: *logging
    <<: *worker
    build: {<<: *build, args: {SERVICE: '@pactora/execution-bot'}}
    environment:
      <<: *worker-env
      PACTORA_API_KEY: ${EXECUTION_BOT_API_KEY:-}

volumes:
  pactora-full-pg:
  pactora-full-minio:
