<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .links {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 18px;
        width: 1300px;
        margin: 0 auto;
      }
      .l {
        padding: 22px;
        border: 1px solid #232833;
        border-radius: 16px;
        background: rgba(15, 18, 25, 0.8);
        text-align: left;
      }
      .l b {
        display: block;
        font-size: 24px;
        margin-bottom: 6px;
      }
      .l span {
        font-size: 19px;
        color: #8b94a7;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap" style="display: flex; flex-direction: column; gap: 40px; align-items: center">
      <div class="brand in d1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6ea8ff" />
              <stop offset="100%" stop-color="#9d8cff" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8.5" fill="url(#g)" />
          <g fill="#07090d">
            <path
              d="M4.24 28.18V16.42A11.2 11.2 0 0 1 12.913 5.653L14.457 11.037A5.6 5.6 0 0 0 10.4 16.42V28.18Z"
            />
            <path
              d="M27.76 28.18V16.42A11.2 11.2 0 0 0 19.087 5.653L17.543 11.037A5.6 5.6 0 0 1 21.6 16.42V28.18Z"
            />
            <path d="M13.23 3.923H18.77L17.212 10.953H14.788Z" />
          </g></svg
        ><span>Pact<span class="x">ora</span></span>
      </div>
      <h1 class="in d2" style="font-size: 64px">
        Give your agent a wallet it can't overspend,<br />and a reputation it can't fake.
      </h1>
      <div class="links in d3">
        <div class="l"><b>Live on Monad testnet</b><span class="mono">TaskEscrow 0x14b9…7dc6</span></div>
        <div class="l"><b>Open source</b><span class="mono">github.com/gopaltalaviya/agentx-*</span></div>
        <div class="l"><b>For any agent</b><span>TypeScript SDK · worker runtime · MCP server</span></div>
      </div>
      <p class="lead in d4" style="font-size: 24px">
        Monad Metropolis · Track 4 — Trust, Identity &amp; AI Infrastructure
      </p>
    </div>
  </body>
</html>
