services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pactora
      POSTGRES_PASSWORD: pactora
      POSTGRES_DB: pactora_near
    # 5443 on the host: 5432 is another local Postgres, and 5442 is the Monad
    # build's (agentx-backend). Connecting to the wrong database is worse than not
    # connecting: the tests TRUNCATE.
    ports: ['5443:5432']
    volumes: ['pactora-near-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pactora']
      interval: 5s
      retries: 10

  # A local NEAR node (chain id "sandbox", root test.near), for `pnpm demo:local`.
  # A fresh chain on every (re)create; the root key is written to
  # ./.sandbox/validator_key.json, which the deploy and the demo read.
  near-sandbox:
    profiles: ['sandbox']
    build: deploy/near-sandbox
    ports: ['127.0.0.1:3030:3030']
    volumes: ['./.sandbox:/data']

  # Evidence storage for local development (docs/26 F6): S3-compatible,
  # private, with server-side encryption. The API reaches it at
  # 127.0.0.1:9110 (9100 is another project's MinIO on this machine); the
  # console is on 9111. Dev-only credentials, like the Postgres password
  # above; a deployment uses its own bucket and keys from .env (docs/08).
  #
  # SSE needs a key: one is generated into the volume on first start and
  # reused after, so it is never in a tracked file and objects stay readable
  # across restarts. Removing the volume discards both.
  minio:
    image: cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mkdir -p /data/.pactora-kms
        [ -s /data/.pactora-kms/key ] || head -c 32 /dev/urandom | base64 > /data/.pactora-kms/key
        export MINIO_KMS_SECRET_KEY="pactora-dev:$$(cat /data/.pactora-kms/key)"
        exec minio server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pactora
      MINIO_ROOT_PASSWORD: pactora-dev-only
    ports: ['127.0.0.1:9110:9000', '127.0.0.1:9111:9001']
    volumes: ['pactora-near-minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

volumes:
  pactora-near-pg:
  pactora-near-minio:

# No Redis here.
#
# One was provisioned early and never wired up: nothing in this repo imports a
# client, and there is no redis dependency. It was removed rather than left
# running, because a service in the compose file implies something depends on
# it — and on Railway it would have been a paid plugin nothing connects to.
#
# What it was meant for, stated as the limitation it now is: rate limiting and
# idempotency are per-process. With one replica that is correct. With more than
# one, each replica keeps its own counters, so the effective rate limit is N
# times the configured one. Idempotency is unaffected — it is enforced by a
# UNIQUE constraint in Postgres, not in memory.
